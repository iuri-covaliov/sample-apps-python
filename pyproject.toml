[project]
name = "python-sample-app"
version = "0.1.0"
description = "Sample App: Python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "coverage>=7.11.3",
    "mypy>=1.18.2",
    "pytest>=9.0.0",
    "ruff>=0.14.4",
]

[tool.coverage.run]
source = [
    "app/",
]
omit = [
    # omit files with tests and test utils
    "*/test_*.py",
    "*/mock_*.py",
    "*/conftest.py",
    "*/tests/**/__init__.py",
    "*/tests/**/helpers.py",
    # omit anything in a .local directory anywhere
    # "*/.local/*",
    # omit everything in /usr
    # "/usr/*",
    # omit this single file
    # "utils/tirefire.py",
]

[tool.coverage.report]
skip_empty = true
fail_under = 90

[tool.mypy]
# python_version = "3.13"
warn_unused_ignores = true
disallow_untyped_defs = true
strict_optional = true
exclude = [
    'data/',  # TOML literal string (single-quotes, no escaping necessary)
    "tmp/",  # TOML basic string (double-quotes, backslash and other characters need escaping)
    "migrations/"
]

[tool.pytest.ini_options]
addopts = "-v -r a -s"
pythonpath = "app"
testpaths = [
    "tests",
    "integration",
]

[tool.ruff]
exclude = ["migrations/"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W"]
extend-select = [
    # "E501"  # line too long
]
ignore = []
